<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <h2>Update Your Profile</h2>

    <div th:if="${message}" style="color:green;">
        <p th:text="${message}"></p>
    </div>

    <form th:action="@{/api/auth/update}" th:object="${signUpRequest}" method="post">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}" required />
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{email}" required />
        </div>

        <div>
            <label for="role">Role:</label>
            <input type="text" id="role" th:field="*{role}" readonly /> <!-- Role is usually readonly -->
        </div>

        <div>
            <label for="password">New Password:</label>
            <input type="password" id="password" th:field="*{password}" placeholder="Leave blank to keep current" />
        </div>

        <div>
            <button type="submit">Update Profile</button>
        </div>
		
    </form>
</body>
</html>
