<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - TaskHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f5f6f8; }
    .card { border:1px solid #e6e6e6; box-shadow:0 2px 8px rgba(0,0,0,.04); }
  </style>
</head>
<body>
<nav class="navbar bg-white border-bottom mb-3">
  <div class="container d-flex justify-content-between">
    <a class="navbar-brand fw-semibold" href="/dashboard">TaskHub</a>
    <div>
      <a th:if="${myself != null and myself.role.name() == 'ADMIN'}"
         class="btn btn-primary btn-sm" href="/projects/new">+ Create project</a>
      <a class="btn btn-outline-secondary btn-sm" href="/projects">All projects</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="row g-3">
    <!-- My / Recent Projects -->
    <div class="col-12 col-lg-7">
      <div class="card p-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="mb-0">Projects</h5>
          <a class="small" href="/projects">View all</a>
        </div>

        <div th:if="${#lists.isEmpty(projects)}" class="text-muted">
          No projects yet.
          <a th:if="${myself != null and myself.role.name() == 'ADMIN'}" href="/projects/new">Create one</a>.
        </div>

        <ul class="list-group list-group-flush" th:if="${!#lists.isEmpty(projects)}">
          <li class="list-group-item d-flex justify-content-between align-items-center"
              th:each="p : ${projects}">
            <div>
              <a th:href="@{|/projects/${p.id}|}" class="fw-semibold" th:text="${p.name}">Project</a>
              <div class="small text-muted">
                <span th:text="${p.projectType}">TEAM_MANAGED</span>
                ·
                <span th:text="${p.createdBy != null ? p.createdBy.name : ''}"></span>
              </div>
            </div>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{|/projects/${p.id}|}">Open</a>
          </li>
        </ul>
      </div>
    </div>

    <!-- Quick Actions / Placeholder for tasks -->
    <div class="col-12 col-lg-5">
      <div class="card p-3">
        <h5>Quick actions</h5>
        <div class="d-grid gap-2">
          <a th:if="${myself != null and myself.role.name() == 'ADMIN'}" class="btn btn-primary" href="/projects/new">Create project</a>
          <a class="btn btn-outline-secondary" href="/projects">Browse projects</a>
        </div>
      </div>

      <div class="card p-3 mt-3">
        <h6 class="mb-2">My tasks (coming soon)</h6>
        <div class="text-muted small">We’ll plug tasks here later.</div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
