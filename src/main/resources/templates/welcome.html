<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome - TaskHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="success-container">
        <h2>🎉 Welcome to TaskHub!</h2>
        <p><strong>Hello, </strong><span id="username" th:text="${response.username}"></span>!</p>
        
        <div style="background-color: #e8f5e8; padding: 15px; border-radius: 8px; margin: 20px 0;">
            <p><strong>Status:</strong> <span th:text="${response.message}"></span></p>
        </div>

        <div style="background-color: #f5f5f5; padding: 15px; border-radius: 8px; margin: 20px 0;">
            <h4>Your Roles:</h4>
            <ul style="list-style: none; padding: 0;">
                <li th:each="role : ${response.roles}" 
                    style="background-color: #3498db; color: white; padding: 5px 10px; margin: 5px; border-radius: 15px; display: inline-block;">
                    <span th:text="${role}"></span>
                </li>
            </ul>
        </div>

        <div style="background-color: #fff3cd; padding: 15px; border-radius: 8px; margin: 20px 0;">
            <h4>🔐 JWT Token Generated Successfully!</h4>
            <p style="font-size: 12px; word-break: break-all; color: #856404;">
                <span id="jwtToken" th:text="${response.token}"></span>
            </p>
            <p style="font-size: 12px; color: #856404;">
                This token has been automatically saved and will be used for authenticated requests.
            </p>
        </div>

        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 30px;">
            <button onclick="navigateToProfile()" 
                    style="background-color: #3498db; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer;">
                👤 View & Update Profile
            </button>
            
            <button onclick="logout()" 
                    style="background-color: #e74c3c; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer;">
                🚪 Logout
            </button>
        </div>
    </div>

    <script>
        // Save JWT token into localStorage after successful login
        document.addEventListener("DOMContentLoaded", function () {
            let token = document.getElementById("jwtToken").textContent;
            if (token && token.trim() !== "") {
                localStorage.setItem("jwt", token);
                console.log("✅ JWT token stored in localStorage successfully!");
                
                // Add token to all future requests automatically
                addTokenToRequests();
            }
        });

        // Function to add JWT token to all AJAX requests
        function addTokenToRequests() {
            // Override XMLHttpRequest to add Authorization header
            let originalXHROpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function() {
                let xhr = this;
                originalXHROpen.apply(xhr, arguments);
                
                xhr.addEventListener('readystatechange', function() {
                    if (xhr.readyState === 1) { // OPENED
                        let token = localStorage.getItem('jwt');
                        if (token) {
                            xhr.setRequestHeader('Authorization', 'Bearer ' + token);
                        }
                    }
                });
            };

            // Override fetch to add Authorization header
            let originalFetch = window.fetch;
            window.fetch = function(url, options) {
                options = options || {};
                options.headers = options.headers || {};
                
                let token = localStorage.getItem('jwt');
                if (token) {
                    options.headers['Authorization'] = 'Bearer ' + token;
                }
                
                return originalFetch(url, options);
            };
        }

        // Function to navigate to profile page with JWT token
        function navigateToProfile() {
            let token = localStorage.getItem('jwt');
            if (token) {
                // Navigate to profile page with JWT token as query parameter
                window.location.href = '/api/auth/update?jwt_token=' + encodeURIComponent(token);
            } else {
                alert('No JWT token found. Please login again.');
                window.location.href = '/api/auth/login';
            }
        }

        // Logout function
        function logout() {
            localStorage.removeItem('jwt');
            window.location.href = '/api/auth/login';
        }
    </script>
</body>
</html>
