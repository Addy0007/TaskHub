<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Projects · TaskHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        body{ background:#f5f6f8; }
        .card{ border:1px solid #e0e6e6; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
        .project-card:hover{ transform:translateY(-2px); box-shadow:0 12px 24px rgba(18,38,63,.08); }

        /* clamp long text to 2 lines */
        .clamp-2{
          display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
          overflow:hidden;
        }

        /* “Project Dashboard” button – compact, red on hover */
        .btn-dashboard{ background:#0d6efd; color:#fff; border-radius:6px; padding:6px 14px; font-weight:600; }
        .btn-dashboard:hover{ background:#dc3545; color:#fff; }
    </style>

    <!-- Load app.js with ?jwt_token so patchLinks()/nav() can work -->
    <script>
        (function () {
          const jwt = localStorage.getItem('jwt');
          const q = jwt ? ('?jwt_token=' + encodeURIComponent(jwt)) : '';
          const s = document.createElement('script');
          s.src = '/js/app.js' + q;     // loads with token
          document.head.appendChild(s);
        })();
    </script>
</head>
<body>

<!-- Top bar -->
<nav class="navbar bg-white border-bottom mb-3">
    <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand" href="#" onclick="return nav('/projects/dashboard');">TaskHub</a>

        <div>
            <a class="btn btn-dashboard btn-sm"
               href="#"
               onclick="return nav('/projects/dashboard');">
                Project Dashboard
            </a>
        </div>
    </div>
</nav>

<div class="container py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Projects</h3>

        <!-- Only admins see Create Project -->
        <a th:if="${me != null and me.role.name() == 'ADMIN'}"
           class="btn btn-primary btn-sm"
           href="#"
           onclick="return nav('/projects/new');">
            + Create project
        </a>
    </div>

    <!-- Card grid -->
    <div class="row row-cols-1 row-cols-md-3 g-3" th:if="${!#lists.isEmpty(projects)}">
        <div class="col" th:each="p : ${projects}">
            <div class="card h-100 project-card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <h5 class="card-title mb-1">
                            <a class="link-dark fw-semibold text-decoration-none"
                               href="#"
                               th:onclick="|return nav('/projects/${p.id}');|"
                               th:text="${p.name}">Project name</a>
                        </h5>
                        <span class="badge text-bg-secondary" th:text="${p.projectType}">TEAM_MANAGED</span>
                    </div>

                    <p class="card-text text-muted clamp-2 mt-1"
                       th:text="${p.description != null ? p.description : 'Short description…'}">
                        Short description…
                    </p>

                    <div class="small text-muted mt-2">
                        Created by
                        <span th:text="${p.createdBy != null ? p.createdBy.name : '—'}">Creator</span>
                    </div>
                </div>

                <div class="card-footer bg-white border-0 pt-0">
                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-primary btn-sm"
                           href="#"
                           th:onclick="|return nav('/projects/${p.id}/tasks');|">
                            View tasks
                        </a>
                        <a class="btn btn-light btn-sm"
                           href="#"
                           th:onclick="|return nav('/projects/${p.id}');|">
                            Open
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(projects)}" class="alert alert-light border">
        No projects yet.
        <a href="#" th:if="${me != null and me.role.name() == 'ADMIN'}"
           onclick="return nav('/projects/new');">Create the first project</a>.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Fallbacks so the page still works even if /js/app.js hasn't finished yet -->
<script>
    // Minimal nav() so all buttons/links carry the JWT
    (function () {
      if (typeof window.nav !== 'function') {
        window.nav = function (path) {
          const t = localStorage.getItem('jwt');
          if (!t) { window.location.href = '/api/auth/login'; return false; }
          const sep = path.includes('?') ? '&' : '?';
          window.location.href = path + sep + 'jwt_token=' + encodeURIComponent(t);
          return false;
        }
      }
      if (typeof window.patchLinks === 'function') patchLinks();
    })();
</script>
</body>
</html>
