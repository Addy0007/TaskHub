<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Projects - TaskHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap (CDN for quick styling) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f6f8; }
        .card { border: 1px solid #e6e6e6; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
        .project-card:hover { border-color:#b9c6d8; background:#fbfcfe; }
    </style>
</head>
<body>

<nav class="navbar bg-white border-bottom mb-3">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand fw-semibold" href="/dashboard">TaskHub</a>
        <div class="d-flex align-items-center gap-2">
            <!-- Show + only to admins -->
            <a th:if="${myself != null and me.role.name() == 'ADMIN'}"
               class="btn btn-primary btn-sm" href="/projects/new">+ Create project</a>
        </div>
    </div>
</nav>

<div class="container py-3">
    <h3 class="mb-3">Projects</h3>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(projects)}" class="alert alert-light border">
        No projects yet.
        <a th:if="${me != null and me.role.name() == 'ADMIN'}" href="/projects/new">Create the first project</a>.
    </div>

    <!-- Project grid -->
    <div class="row g-3" th:if="${!#lists.isEmpty(projects)}">
        <div class="col-12 col-md-6 col-lg-4" th:each="p : ${projects}">
            <a th:href="@{|/projects/${p.id}|}" class="text-decoration-none text-reset">
                <div class="card project-card p-3 h-100">
                    <div class="d-flex justify-content-between align-items-start">
                        <h5 class="mb-1" th:text="${p.name}">Project name</h5>
                        <span class="badge text-bg-secondary" th:text="${p.projectType}">TEAM_MANAGED</span>
                    </div>
                    <p class="text-muted mb-2"
                       th:text="${p.description != null
             ? (#strings.length(p.description) > 110
                ? #strings.substring(p.description, 0, 110) + '…'
                : p.description)
             : ''}">
                        Short description of the project…
                    </p>
                    <div class="small text-muted">
                        Created by <span th:text="${p.createdBy != null ? p.createdBy.name : '—'}">Creator</span>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
