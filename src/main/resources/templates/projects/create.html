<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Project - TaskHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#f5f6f8; min-height:100vh; }
        .card { border:1px solid #e0e6eb; box-shadow:0 2px 8px rgba(0,0,0,.05); }
        .type-card { transition:all .15s; }
        .type-card:hover { border-color:#06f; background:#f0f6ff; }
        .checkmark { font-size:18px; line-height:1; }
        .checkmark.hidden { visibility:hidden; }
    </style>
</head>
<body>
<nav class="navbar mb-4">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand fw-semibold" href="#" onclick="return nav('/projects')">TaskHub</a>
    </div>
</nav>

<div class="container page-wrap justify-content-center">
    <div class="col-12 col-lg-8 col-xl-7">
        <div class="card p-4">
            <h3 class="mb-3">Create Project</h3>

            <!-- Form bound to Project -->
            <form id="createForm" th:object="${form}" method="post">
                <!-- Name -->
                <div class="mb-3">
                    <label class="form-label">Name <span class="text-danger">*</span></label>
                    <input class="form-control" th:field="*{name}" placeholder="e.g. Patient Engagement" required />
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" th:field="*{description}" rows="3"
                              placeholder="Briefly describe the project"></textarea>
                </div>
                <!-- Template (fixed, read-only like before) -->
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Template</label>
                        <!-- Visible, read-only display -->
                        <input class="form-control" value="Project Management" readonly />
                        <!-- OPTIONAL: submit a value with the form (keep if your Project has a field for it) -->
                        <input type="hidden" name="template" value="PROJECT_MANAGEMENT"/>
                    </div>
                </div>

                <!-- Hidden enum -->
                <input type="hidden" th:field="*{projectType}" id="projectTypeField"/>

                <!-- Type selection -->
                <div class="d-grid gap-2 mb-3">
                    <button type="button" class="type-card rounded p-3 text-start"
                            data-value="TEAM_MANAGED" onclick="selectType(this)">
                        <div class="d-flex justify-content-between align-items-center">
                            <div><span class="fw-semibold">Team-managed</span></div>
                            <span class="checkmark hidden">&check;</span>
                        </div>
                        <small class="text-muted">For teams with independent processes</small>
                    </button>

                    <button type="button" class="type-card rounded p-3 text-start"
                            data-value="COMPANY_MANAGED" onclick="selectType(this)">
                        <div class="d-flex justify-content-between align-items-center">
                            <div><span class="fw-semibold">Company-managed</span></div>
                            <span class="badge bg-secondary">ADMIN ONLY</span>
                        </div>
                        <small class="text-muted">Shared settings across projects</small>
                    </button>
                </div>

                <!-- Actions -->
                <div class="mt-4 d-flex gap-2">
                    <a href="#" class="btn btn-primary" role="button"
                       onclick="return gotoProjectsDashboard(event);">
                        &larr; Back to Projects
                    </a>
                    <button class="btn btn-primary" type="submit">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Handle type selection
    function selectType(btn) {
        const field = document.getElementById("projectTypeField");
        field.value = btn.dataset.value;
        document.querySelectorAll(".type-card").forEach(c => {
            c.classList.remove("selected");
            c.querySelector(".checkmark")?.classList.add("hidden");
        });
        btn.classList.add("selected");
        btn.querySelector(".checkmark")?.classList.remove("hidden");
    }

    // Default to TEAM_MANAGED
    document.addEventListener("DOMContentLoaded", () => {
        selectType(document.querySelector('[data-value="TEAM_MANAGED"]'));
    });

    // Back to dashboard
    function gotoProjectsDashboard(ev) {
        ev.preventDefault();
        const jwt = localStorage.getItem("jwt");
        const url = "/projects/dashboard" + (jwt ? "?jwt_token=" + encodeURIComponent(jwt) : "");
        window.location.assign(url);
        return false;
    }

    // Attach JWT to form submit
    document.getElementById("createForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const jwt = localStorage.getItem("jwt");
        if (!jwt) {
            alert("JWT missing! Please login again.");
            return;
        }
        this.action = "/projects/new?jwt_token=" + encodeURIComponent(jwt);
        this.submit();
    });
</script>
</body>
</html>
