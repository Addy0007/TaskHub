<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 (CDN for quick visual fix) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f6f8; }
        .page-wrap { min-height: 100vh; display: flex; align-items: flex-start; }
        .card { border: 1px solid #e6e6e6; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .type-card { border: 1px solid #dce1e6; transition: all .15s; }
        .type-card:hover { border-color:#86b7fe; background:#f8fbff; }
        .type-card.selected { border-color:#0d6efd; background:#eef5ff; }
        .checkmark { font-size: 1rem; opacity:.9 }
        .checkmark.hidden { visibility: hidden; }
    </style>
</head>
<body>

<nav class="navbar navbar-light bg-white border-bottom mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="/ui/projects">TaskHub</a>
    </div>
</nav>

<div class="container page-wrap">
    <div class="row w-100 justify-content-center">
        <div class="col-12 col-lg-8 col-xl-7">
            <div class="card p-4">
                <h3 class="mb-3">Create project</h3>

                <form th:action="@{/ui/projects/new}" th:object="${form}" method="post" novalidate>
                    <div class="row g-3">
                        <!-- Name -->
                        <div class="col-12">
                            <label class="form-label">Name <span class="text-danger">*</span></label>
                            <input class="form-control" th:field="*{name}" placeholder="e.g. Patient Engagement" required>
                            <div class="invalid-feedback d-block"
                                 th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <!-- Description -->
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" th:field="*{description}" rows="3"
                                      placeholder="Briefly describe the goal of this project"></textarea>
                        </div>

                        <!-- Template (fixed) -->
                        <div class="col-md-6">
                            <label class="form-label">Template</label>
                            <input class="form-control" value="Project Management" readonly>
                        </div>
                    </div>

                    <!-- Project type cards -->
                    <div class="mt-4">
                        <label class="form-label">Project type</label>
                        <!-- hidden field carrying the enum -->
                        <input type="hidden" th:field="*{projectType}" id="projectTypeField"/>

                        <div class="d-grid gap-2">
                            <!-- Team-managed -->
                            <button type="button" class="type-card rounded p-3 text-start"
                                    data-value="TEAM_MANAGED" onclick="selectType(this)">
                                <div class="d-flex justify-content-between">
                                    <div class="fw-semibold">Team-managed</div>
                                    <span class="checkmark">✔</span>
                                </div>
                                <small class="text-muted">
                                    For teams who control their own processes in a self‑contained space.
                                </small>
                            </button>

                            <!-- Company-managed -->
                            <button type="button" class="type-card rounded p-3 text-start"
                                    data-value="COMPANY_MANAGED" onclick="selectType(this)">
                                <div class="d-flex justify-content-between">
                                    <div class="fw-semibold">Company-managed</div>
                                    <span class="badge bg-secondary">ADMINISTRATORS ONLY</span>
                                </div>
                                <small class="text-muted">
                                    Shared, standardized settings across many projects.
                                </small>
                            </button>
                        </div>
                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <a class="btn btn-outline-secondary" href="/ui/projects">Back</a>
                        <button class="btn btn-primary" type="submit">Create</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
      const field = document.getElementById('projectTypeField');
      const cards = document.querySelectorAll('.type-card');

      function applySelection(v){
        field.value = v;
        cards.forEach(c=>{
          const sel = c.dataset.value === v;
          c.classList.toggle('selected', sel);
          const mark = c.querySelector('.checkmark');
          if (mark) mark.classList.toggle('hidden', !(sel && v === 'TEAM_MANAGED'));
        });
      }
      // init (default TEAM_MANAGED)
      applySelection(field.value || 'TEAM_MANAGED');
      window.selectType = el => applySelection(el.dataset.value);
    })();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
