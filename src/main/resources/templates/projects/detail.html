<!-- templates/projects/detail.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8"/>
    <title th:text="${project.name} + ' · TaskHub'">Project</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <!-- allow JS to read token without polluting URLs -->
    <meta name="jwt" th:content="${jwt}"/>
    <style>
        :root{--bg:#f8fafc;--card:#fff;--text:#172937;--muted:#6b7280;--brand:#2563eb;--ok:#10b981;--err:#ef4444}
        body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto}
        .container{max-width:1000px;margin:24px auto;padding:16px}
        .card{background:var(--card);border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
        .row{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
        .grow{flex:1 1 0}
        h1{margin:0 0 6px;font-size:28px}
        .muted{color:var(--muted)}
        .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#eef2ff;color:#4f46e5}
        .btn{appearance:none;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
        .btn.link{background:transparent;color:var(--brand);padding:0}
        .btn.primary{background:var(--brand);color:#fff}
        .btn.danger{background:#fee2e2;color:#991b1b}
        .input{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px}
        ul.list{list-style:none;margin:0;padding:0}
        ul.list li{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eef2f7}
        .toast{position:fixed;right:24px;bottom:24px;border-radius:10px;color:#fff;padding:10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
        .toast.ok{background:var(--ok)} .toast.err{background:var(--err)}
    </style>
</head>
<body>
<div class="container">

    <div class="card" style="padding:24px">
        <div class="row">
            <div class="grow">
                <h1 th:text="${project.name}">Project name</h1>
                <div class="muted" th:text="${project.description}">Description…</div>
                <div style="margin-top:10px;display:flex;gap:10px;align-items:center">
                    <span class="badge" th:text="${project.projectType}">TEAM_MANAGED</span>
                    <span class="muted">Created by <strong th:text="${project.createdBy.name}">Admin</strong></span>
                </div>
            </div>
            <div><a th:href="@{/projects/dashboard(jwt_token=${jwt})}"class="navbar-brand">← Back to Projects Dashboard</a></div>
        </div>
    </div>

    <div class="card" style="padding:24px;margin-top:20px">
        <div class="section-title">Members</div>
        <ul class="list">
            <li th:each="m : ${project.members}">
                <div>
                    <div th:text="${m.name}">Full Name</div>
                    <div class="muted" th:text="${m.email}">email@example.com</div>
                </div>
                <div th:if="${isAdmin}">
                    <form
                            th:action="@{/projects/{id}/members/{userId}/remove(
                      id=${project.id},
                      userId=${m.id},
                      jwt_token=${jwt}
                    )}"
                            method="post"
                            style="display:inline"
                    >
                        <button class="btn danger" type="submit">Remove</button>
                    </form>
                </div>
            </li>
        </ul>

        <div th:if="${isAdmin}" style="margin-top:18px">
            <form
                    th:action="@{/projects/{id}/members(
                  id=${project.id},
                  jwt_token=${jwt}
                )}"
                    method="post"
                    class="row"
                    style="gap:12px; align-items:center"
            >
                <input class="input grow" type="email" name="email" placeholder="user@example.com" required/>
                <button class="btn primary" type="submit">Add</button>
            </form>
            <div class="muted" style="margin-top:6px">
                The user must already exist in <a th:href="@{/users(jwt_token=${jwt})}">Users</a>.
            </div>
        </div>

<div th:if="${notify}" class="toast ok" th:text="${notify}">Saved</div>
<div th:if="${error}"  class="toast err" th:text="${error}">Something went wrong</div>

<script src="/js/app.js"></script>
<script>initProjectDetail();</script>
</body>
</html>
