<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${project.name} + ' – Project'">Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Quick styling via Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f5f6f8; }
        .card { border:1px solid #e7e7e7; box-shadow:0 2px 8px rgba(0,0,0,.05); }
        .badge-type { letter-spacing:.2px; }
    </style>
</head>
<body>

<nav class="navbar bg-white border-bottom">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand fw-semibold" href="/dashboard">TaskHub</a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary btn-sm" href="/projects">Back to Projects</a>
        </div>
    </div>
</nav>

<div class="container py-4">

    <!-- Flash messages -->
    <div th:if="${notify != null}" class="alert alert-success" th:text="${notify}"></div>
    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>


    <!-- Project header -->
    <div class="card p-4 mb-4">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h3 class="mb-1" th:text="${project.name}">Project Name</h3>
                <p class="text-muted mb-2" th:text="${project.description}">Short description…</p>
                <span class="badge text-bg-secondary badge-type" th:text="${project.projectType}">TEAM_MANAGED</span>
                <span class="ms-2 text-muted small">
          Created by <b th:text="${project.createdBy != null ? project.createdBy.name : '—'}">Creator</b>
        </span>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Members list -->
        <div class="col-12 col-lg-6">
            <div class="card p-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="mb-0">Members</h5>
                    <span class="text-muted small" th:text="${#lists.size(project.members)} + ' total'">0 total</span>
                </div>

                <div th:if="${#lists.isEmpty(project.members)}" class="alert alert-light border mb-0">
                    No members yet. Add someone from the form on the right.
                </div>

                <ul class="list-group list-group-flush" th:if="${!#lists.isEmpty(project.members)}">
                    <li class="list-group-item d-flex justify-content-between align-items-center"
                        th:each="m : ${project.members}">
                        <div class="me-3">
                            <div class="fw-semibold" th:text="${m.name}">Member Name</div>
                            <div class="text-muted small" th:text="${m.email}">email@example.com</div>
                        </div>

                        <!-- Remove member -->
                        <form th:action="@{|/projects/${project.id}/members/${m.id}/remove|}" method="post" class="ms-2">
                            <!-- CSRF (if enabled) -->
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-danger" type="submit" title="Remove">
                                Remove
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Add member by email -->
        <div class="col-12 col-lg-6">
            <div class="card p-3">
                <h5 class="mb-3">Add member by email</h5>
                <form th:action="@{|/projects/${project.id}/members|}" method="post" class="row g-2">
                    <!-- CSRF (if enabled) -->
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="col-12 col-md-8">
                        <input type="email" class="form-control" name="email" placeholder="user@example.com" required>
                    </div>
                    <div class="col-12 col-md-4">
                        <button class="btn btn-primary w-100" type="submit">Add</button>
                    </div>
                </form>
                <small class="text-muted d-block mt-2">
                    The user must already exist in <a href="/users">Users</a>.
                </small>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
