<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${project != null} ? ${project.name} + ' – Tasks' : 'Tasks'">Tasks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

    <style>
        body { background:#f5f6f8; }
        .page { max-width: 1080px; margin: 32px auto; }
        .card.task { border:1px solid #e7e7ec; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
        .badge-status { font-weight: 500; }
    </style>

    <!-- Load protected JS/CSS with token (same pattern you used elsewhere) -->
    <script th:inline="javascript">
        (function () {
          const jwt = /[[${jwt}]]/ null;                // from model, can be null
          const q   = jwt ? ('?jwt_token=' + encodeURIComponent(jwt)) : '';

          // helper bundle (nav/getJwt/attachJwtToForm/etc)
          const js = document.createElement('script');
          js.src = '/js/app.js' + q;                      // ✅ loads with token
          document.head.appendChild(js);

          // optional: your protected css
          const css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = '/css/style.css' + q;
          document.head.appendChild(css);
        })();
    </script>
</head>

<body>
<div class="page">
    <!-- Top bar -->
    <nav class="navbar bg-white border rounded mb-3 px-3">
        <a class="navbar-brand fw-semibold" href="#" onclick="return nav('/projects');">TaskHub</a>
        <div class="d-flex">
            <a class="btn btn-outline-secondary btn-sm"
               href="#"
               onclick="return nav('/projects');">
                &larr; Back to Projects
            </a>
        </div>
    </nav>

    <!-- Header -->
    <div class="mb-3">
        <h3 class="mb-1" th:text="${project != null} ? ${project.name} : 'Project'">Project</h3>
        <div class="text-muted" th:if="${project != null}">
            <span>ID:</span>
            <code th:text="${project.id}">1</code>
        </div>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(tasks)}" class="alert alert-light border">
        No tasks found for this project.
    </div>

    <!-- Task list -->
    <div class="row g-3" th:if="${!#lists.isEmpty(tasks)}">
        <div class="col-12">
            <div class="card">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th style="width:60px;">#</th>
                            <th>Title</th>
                            <th style="width:140px;">Status</th>
                            <th style="width:180px;">Assignee</th>
                            <th style="width:180px;">Updated</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="t,idx : ${tasks}">
                            <td th:text="${idx.count}">1</td>
                            <td>
                                <a href="#"
                                   th:text="${t.title}"
                                   th:onclick="|return nav('/tasks/' + ${t.id});|">
                                    Sample task
                                </a>
                            </td>
                            <td>
                    <span class="badge text-bg-secondary badge-status"
                          th:text="${t.status}">OPEN</span>
                            </td>
                            <td th:text="${t.assignee != null ? t.assignee.name : '-'}">-</td>
                            <td th:text="${#dates.format(t.updatedAt, 'yyyy-MM-dd HH:mm')}">—</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer actions (optional) -->
    <div class="mt-3 d-flex gap-2">
        <a class="btn btn-outline-secondary" href="#" onclick="return nav('/projects');">
            &larr; Back to Projects
        </a>
        <!-- example: link to create a task under this project -->
        <a class="btn btn-primary"
           href="#"
           th:onclick="|return nav('/projects/' + ${project.id} + '/tasks/new');|">
            + New Task
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Patch internal links with JWT after app.js is ready -->
<script>
    // guard: if app.js hasn’t initialized nav() yet, create a no-op that falls back to location
    window.nav = window.nav || function (path) {
      const jwt = (window.getJwt && window.getJwt()) || (window.localStorage && localStorage.getItem('jwt'));
      const q   = jwt ? (path.includes('?') ? '&' : '?') + 'jwt_token=' + encodeURIComponent(jwt) : '';
      window.location.assign(path + q);
      return false;
    };
</script>
</body>
</html>
