<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${project.name} + ' – Tasks'">Project Tasks</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .chip { display:inline-block; padding:.25rem .5rem; border-radius:999px; background:#f1f3f5; font-size:.8rem; margin-right:.25rem }
        .list-item { border:1px solid #e9ecef; border-radius:.5rem; padding:1rem; margin-bottom:.75rem; background:#fff }
        .muted { color:#6c757d; font-size:.9rem }
    </style>
</head>
<body>
<div class="container mt-4">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <h2 class="mb-1" th:text="${project.name}">Project Name</h2>
            <div class="muted" th:text="${project.description}">Short description…</div>
        </div>
        <div class="text-end">
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm">← Back to Dashboard</a>
        </div>
    </div>

    <!-- Flash messages (optional) -->
    <div th:if="${toast}" class="alert alert-success" th:text="${toast}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(tasks)}" class="alert alert-info">
        No tasks yet for this project.
    </div>

    <!-- Tasks -->
    <div th:each="t : ${tasks}" class="list-item">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h5 class="mb-1">
                    <span th:text="${t.title}">Task title</span>
                </h5>
                <div class="muted" th:text="${t.description}">Description…</div>

                <!-- chips -->
                <div class="mt-2">
                    <span class="chip" th:text="${'Status: ' + t.status}">Status: TODO</span>
                    <span class="chip" th:text="${'Priority: ' + t.priority}">Priority: MEDIUM</span>
                    <span class="chip" th:text="${'Created ' + #temporals.format(t.createdAt, 'dd MMM yyyy')}">Created 01 Jan 2025</span>
                    <span class="chip" th:if="${t.createdBy != null}"
                          th:text="${'By ' + t.createdBy.name}">By Admin</span>
                </div>

                <!-- assignees -->
                <div class="mt-2">
                    <span class="muted me-1">Assignees:</span>
                    <span th:if="${#lists.isEmpty(t.assignees)}" class="muted">—</span>
                    <span th:each="u : ${t.assignees}" class="chip" th:text="${u.name}">User Name</span>
                </div>
            </div>

            <!-- Right-side actions (stub) -->
            <div>
                <a th:href="@{|/tasks/${t.id}|}" class="btn btn-sm btn-outline-primary">Open</a>
            </div>
        </div>
    </div>

</div>
</body>
</html>
