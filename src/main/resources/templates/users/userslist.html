<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users - TaskHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar bg-white border-bottom mb-3">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">TaskHub</a>
        <a id="backBtn" href="#" class="btn btn-primary btn-sm" onclick="return backToProjectDetails();">
            ← Project Details
        </a>
    </div>
</nav>

<div class="container">
    <h4 class="mb-3">Users</h4>
    <table class="table table-sm table-striped bg-white">
        <thead>
        <tr><th>Name</th><th>Email</th><th>Role</th></tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.name}">Name</td>
            <td th:text="${u.email}">email@example.com</td>
            <td th:text="${u.role}">USER</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="/js/app.js"></script>
<script>
    function backToProjectDetails() {
      const params = new URLSearchParams(location.search);
      const pid = params.get('fromProjectId');          // carried from details page
      const jwt = localStorage.getItem('jwt');
      const q   = jwt ? ('?jwt_token=' + encodeURIComponent(jwt)) : '';

      if (!pid) {
        // No id carried? stay put or choose your fallback.
        alert('No project id found to return to.');
        return false;
      }

      const url = '/projects/' + encodeURIComponent(pid) + q;  // <-- details page
      window.location.assign(url);
      return false; // prevent default <a> navigation
    }
</script>
</body>
</html>
