<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
</head>
<body>
    <h2>Login Page</h2>
    <div>
        <a href="/api/auth/register">Register</a>
    </div>

    <div th:if="${error}">
        <p style="color: red;" th:text="${error}"></p>
    </div>

    <form th:action="@{/api/auth/login}" th:object="${loginRequest}" method="post">
        <label>Username:</label>
        <input type="text" th:field="*{userName}" placeholder="Enter Username" required />
        <br/>

        <label>Password:</label>
        <input type="password" th:field="*{password}" placeholder="Enter Password" required />
        <br/>

        <button type="submit">Login</button>
    </form>
</body>
</html>
