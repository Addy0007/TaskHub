<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tasks</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 100%;
    padding: 20px;
    background-color: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    box-sizing: border-box;
    margin: 30px auto;
    overflow: hidden;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 800px;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border: 1px solid #ddd;
    text-align: left;
    white-space: nowrap;
}

th {
    background-color: #f8f8f8;
    font-weight: bold;
}

tr:nth-child(even) {
    background-color: #f9f9f9;
}

tr:hover {
    background-color: #eee;
}

.actions {
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
}

.update {
background-color: #3498db;
    color: #fff;
    padding: 6px 12px;
    border-radius: 5px;
    text-decoration: none;
}

.update:hover {
    background-color: #2c80b4;
}

.delete {
    background-color: #e74c3c;
    color: #fff;
    padding: 6px 12px;
    border-radius: 5px;
    text-decoration: none;
}

.delete:hover {
    background-color: #c0392b;
}

.create-task-btn {
    background-color: #4CAF50;
    color: white;
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: block;
    margin: 20px auto 0;
    text-align: center;
    text-decoration: none;
}

.create-task-btn:hover {
    background-color: #3e8e41;
}

@media (max-width: 768px) {
    th, td {
        font-size: 13px;
    }

    .update, .delete {
        padding: 5px 10px;
        font-size: 13px;
    }

    .create-task-btn {
        width: 100%;
        font-size: 16px;
    }
}
   </style>
</head>
<body>
<div class="container">

<h1>Tasks</h1>
    <div class="table-wrapper">

    <table>
    <tr>
        <th>Task ID</th>
        <th>Task Name</th>
        <th>Task Description</th>
        <th>Project ID</th>
        <th>Assigned To</th>
        <th>Status</th>
        <th>Priority</th>
        <th>Due Date</th>
        <th>Actions</th>
    </tr>
    <tr th:each="task : ${tasks}">
        <td th:text="${task.taskId}">Task ID</td>
        <td th:text="${task.taskName}">Task Name</td>
        <td th:text="${task.taskDescription}">Task Description</td>
        <td th:text="${task.projectId}">Project ID</td>
        <td th:text="${task.assignedTo}">Assigned To</td>
        <td th:text="${task.status}">Status</td>
        <td th:text="${task.priority}">Priority</td>
        <td th:text="${task.dueDate}">Due Date</td>
        <td>
            <a th:href="@{/tasks/update/{taskId}(taskId=${task.taskId})}" class="update">Update</a>
            <a th:href="@{/tasks/delete/{taskId}(taskId=${task.taskId})}" class="delete">Delete</a>
        </td>
    </tr>
</table>
    </div>
<a th:href="@{/tasks/create}"><button class="create-task-btn">Create Task</button>
</a>
</div>

</body>
</html>
