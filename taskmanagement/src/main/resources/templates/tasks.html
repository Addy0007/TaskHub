<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tasks</title>
    <style>body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
}

.container {
    max-width: 1200px;
    margin: 40px auto;
    padding: 20px;
    background-color: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

table {
    border-collapse: collapse;
    width: 100%;
}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: left;
}

th {
    background-color: #f0f0f0;
    font-weight: bold;
}

tr:nth-child(even) {
    background-color: #f9f9f9;
}

tr:hover {
    background-color: #ddd;
}

.actions {
    text-align: center;
}

.update-btn, .delete-btn {
    padding: 5px 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.update-btn {
    background-color: #4CAF50;
    color: #fff;
}

.update-btn:hover {
    background-color: #3e8e41;
}

.delete-btn {
    background-color: #e74c3c;
    color: #fff;
}

.delete-btn:hover {
    background-color: #c0392b;
}

.create-task-btn {
    background-color: #4CAF50;
    color: #fff;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    float: right;
    margin-top: 20px;
}

.create-task-btn:hover {
    background-color: #3e8e41;
}

    </style>
</head>
<body>
<div class="container">

<h1>Tasks</h1>
<table>
    <tr>
        <th>Task ID</th>
        <th>Task Name</th>
        <th>Task Description</th>
        <th>Project ID</th>
        <th>Assigned To</th>
        <th>Status</th>
        <th>Priority</th>
        <th>Due Date</th>
        <th>Actions</th>
    </tr>
    <tr th:each="task : ${tasks}">
        <td th:text="${task.taskId}">Task ID</td>
        <td th:text="${task.taskName}">Task Name</td>
        <td th:text="${task.taskDescription}">Task Description</td>
        <td th:text="${task.projectId}">Project ID</td>
        <td th:text="${task.assignedTo}">Assigned To</td>
        <td th:text="${task.status}">Status</td>
        <td th:text="${task.priority}">Priority</td>
        <td th:text="${task.dueDate}">Due Date</td>
        <td>
            <a th:href="@{/tasks/update/{taskId}(taskId=${task.taskId})}">Update</a>
            <a th:href="@{/tasks/delete/{taskId}(taskId=${task.taskId})}">Delete</a>
        </td>
    </tr>
</table>
<a th:href="@{/tasks/create}"><button class="create-task-btn">Create Task</button>
</a>
</div>

</body>
</html>
