<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Task List</title>
    <style>      body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
    margin: 0;
    padding: 0;
}

.container {
    max-width: 100%;
    padding: 20px;
    background-color: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    box-sizing: border-box;
    margin: 30px auto;
    overflow: hidden;
}
form {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}

form input[type="text"], form input[type="search"] {
    width: 50%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ddd;
    border-radius: 5px 0 0 5px;
}

form button[type="submit"] {
    padding: 10px 20px;
    font-size: 16px;
    border: none;
    border-radius: 0 5px 5px 0;
    background-color: #4CAF50;
    color: #fff;
    cursor: pointer;
}

form button[type="submit"]:hover {
    background-color: #3e8e41;
}
h1 {
    text-align: center;
    margin-bottom: 25px;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
}

table {
    width: 100%;
    min-width: 1200px;
    border-collapse: collapse;
}

th, td {
    padding: 12px 15px;
  border: 1px solid #ddd;
  text-align: left;
  white-space: nowrap;
font-size: 14px; /* Reduced font size to fit more columns */

}

th {
    background-color: #f8f8f8;
    font-weight: bold;
}

tr:nth-child(even) {
    background-color: #f9f9f9;
}

tr:hover {
    background-color: #eee;
}

.actions {
    display: flex;
    justify-content: center;
    gap: 6px;
    flex-wrap: wrap;
}

.update {
background-color: #3498db;
    color: #fff;
    padding: 6px 12px;
    border-radius: 5px;
    text-decoration: none;
}

.update:hover {
    background-color: #2c80b4;
}

.delete {
    background-color: #e74c3c;
    color: #fff;
    padding: 6px 12px;
    border-radius: 5px;
    text-decoration: none;
}

.delete:hover {
    background-color: #c0392b;
}

.create-task-btn {
  background-color: #4CAF50;
  color: white;
  padding: 12px 24px;
  font-size: 18px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  display: block;
  margin: 20px auto 0;
  text-align: center;
  text-decoration: none;
  transition: background-color 0.3s ease;
}



.create-task-btn:hover {
    background-color: #3e8e41;
}

@media (max-width: 768px) {
   table {
    min-width: 1000px; /* Adjust min-width for smaller screens */
  }
 th, td {
        font-size: 13px;
         padding: 8px 5px;

    }

    .update, .delete {
        padding: 5px 10px;
        font-size: 13px;
    }
  form input[type="text"], form input[type="search"] {
        width: 70%;
    }


    .create-task-btn {
        width: 100%;
        font-size: 16px;
    }
}
    </style>
</head>
<body>
<table>
    <thead>
    <tr>
        <th>Title</th>
        <th>Description</th>
        <th>Assigned To</th>
        <th>Assigned By</th>
        <th>Status</th>
        <th>Priority</th>
        <th>Category</th>
        <th>Due Date</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="task : tasks">
        <td th:text="{task.title}"></td>
        <td th:text="task.description"></td>
        <td th:text="{task.assignedTo}"></td>
        <td th:text="task.assignedBy"></td>
        <td th:text="{task.status}"></td>
        <td th:text="${task.priority}"></td>
        <td th:text="${task.category}"></td>
        <td th:text="${task.dueDate}"></td>
    </tr>
    </tbody>
</table>


</body>
</html>
